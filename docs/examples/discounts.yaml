version: 1
ruleset:
  hit_policy: "priority"
  logic: "boolean"
  rules:
    - name: "blocked"
      when:
        op: "field"
        path:
          - "customer"
          - "blocked"
      then:
        discount:
          op: "const"
          value: 0
      priority: 99
      description: "blocked customers never get a discount"
    - name: "vip"
      when:
        op: "and"
        operands:
          - op: "gt"
            left:
              op: "field"
              path:
                - "customer"
                - "years"
            right:
              op: "const"
              value: 5
          - op: "gt"
            left:
              op: "field"
              path:
                - "order"
                - "total"
            right:
              op: "const"
              value: 1000
      then:
        discount:
          op: "const"
          value:
            $decimal: "0.15"
      priority: 10
      tags:
        - "loyalty"
    - name: "loyal"
      when:
        op: "or"
        operands:
          - op: "gt"
            left:
              op: "field"
              path:
                - "customer"
                - "years"
            right:
              op: "const"
              value: 2
          - op: "field"
            path:
              - "customer"
              - "newsletter"
      then:
        discount:
          op: "const"
          value:
            $decimal: "0.05"
      priority: 5
      tags:
        - "loyalty"
