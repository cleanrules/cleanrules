name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Rust workspace and the bindings add their own jobs from task B.1 on.
jobs:
  lint:
    name: Lint the Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check --output-format=github .
      - run: uvx ruff format --check .

  conformance:
    name: Spec schemas and conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with jsonschema python spec/schemas/check.py
      - run: uv run --no-project --with jsonschema python conformance/tools/check.py
