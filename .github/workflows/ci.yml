name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The bindings add their own jobs in their phases.
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo fmt --all --check
      # The core's optional features are built and tested too (yaml for now).
      - run: cargo clippy --workspace --all-targets --features cleanrules/yaml -- -D warnings
      - run: cargo nextest run --workspace --features cleanrules/yaml
      - run: cargo test --workspace --doc --features cleanrules/yaml

  coverage:
    name: Core coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The definition of done asks for 95 % of the core's lines.
      - run: cargo llvm-cov -p cleanrules --features yaml --fail-under-lines 95

  c-abi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      # The committed header is the one cbindgen writes.
      - run: cbindgen --config cbindgen.toml --verify --output include/cleanrules.h
        working-directory: crates/ffi
      - run: c++ -fsyntax-only -x c++ -std=c++17 -Wall -Werror crates/ffi/include/cleanrules.h
      - run: cargo build -p cleanrules-ffi
      # The example is strict C11 and runs under the address and undefined
      # behaviour sanitizers.
      - run: >
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -g
          -I crates/ffi/include docs/examples/discounts.c
          target/debug/libcleanrules_ffi.a -lm -lpthread -ldl -o discounts
      - run: ./discounts docs/examples/discounts.rules

  c-abi-windows:
    name: C ABI (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cleanrules-ffi
      # The system libraries the static library needs, as Rust lists them
      # (without colour, which would end up in the library names).
      - shell: bash
        run: |
          libs=$(cargo rustc -q --color never -p cleanrules-ffi --lib --crate-type staticlib -- \
            --print native-static-libs 2>&1 | sed -n 's/.*native-static-libs: //p' | tail -1)
          echo "native-static-libs: $libs"
          echo "NATIVE_LIBS=$libs" >> "$GITHUB_ENV"
      # MSVC, found with vswhere: the header as C++, and the example as C11
      # linked to the static library with its C runtime (/MD).
      - shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /W4 /WX /Zs /I crates\ffi\include /Tp crates\ffi\include\cleanrules.h || exit /b 1
          cl /nologo /std:c11 /W3 /MD /D_CRT_SECURE_NO_WARNINGS /I crates\ffi\include docs\examples\discounts.c /Fe:discounts.exe /link target\debug\cleanrules_ffi.lib %NATIVE_LIBS% || exit /b 1
          discounts.exe docs\examples\discounts.rules

  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debug under the address and undefined behaviour sanitizers.
          - os: ubuntu-latest
            config: Debug
            options: -DCLEANRULES_SANITIZERS=address,undefined
          - os: macos-latest
            config: Debug
            options: -DCLEANRULES_SANITIZERS=address,undefined
          # MSVC, with the release C runtime the Rust objects use.
          - os: windows-latest
            config: Release
            options: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The static library, then the shared one; ctest builds first.
      - run: >
          cmake -S bindings/cpp -B build/cpp -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCLEANRULES_CARGO_TARGET_DIR=${{ github.workspace }}/target ${{ matrix.options }}
      - run: ctest --test-dir build/cpp -C ${{ matrix.config }} --output-on-failure
      - run: >
          cmake -S bindings/cpp -B build/cpp-shared -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCLEANRULES_SHARED=ON -DCLEANRULES_CARGO_TARGET_DIR=${{ github.workspace }}/target
      - run: ctest --test-dir build/cpp-shared -C ${{ matrix.config }} --output-on-failure

  packages:
    name: Conan and vcpkg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The port's version follows the workspace's.
      - shell: bash
        run: |
          workspace=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          port=$(sed -n 's/^ *"version": "\(.*\)",/\1/p' bindings/cpp/vcpkg/ports/cleanrules/vcpkg.json)
          echo "workspace $workspace, vcpkg port $port"
          test "$workspace" = "$port"
      # Conan 2, as CI tooling: the recipe, static and shared, with its test_package.
      - run: pipx install "conan>=2.34,<3"
      - run: conan profile detect
      - run: conan create bindings/cpp/conan --build=missing
      - run: conan create bindings/cpp/conan --build=missing -o "&:shared=True"
      # MSVC: Debug (a /MDd program over the release C runtime) and the static
      # C runtime (/MT, crt-static), through Conan and through plain CMake.
      - if: runner.os == 'Windows'
        run: |
          conan create bindings/cpp/conan --build=missing -s build_type=Debug
          conan create bindings/cpp/conan --build=missing -s compiler.runtime=static
          cmake -S bindings/cpp -B build/cpp-mt -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          ctest --test-dir build/cpp-mt -C Release --output-on-failure
      # The runner's vcpkg with the overlay port, in manifest mode: static and
      # shared on Linux; a DLL and the static C runtime on Windows.
      - shell: bash
        env:
          VCPKG_KEEP_ENV_VARS: CARGO_HOME;RUSTUP_HOME
        run: |
          root=$(cygpath -m "$VCPKG_INSTALLATION_ROOT" 2>/dev/null || echo "$VCPKG_INSTALLATION_ROOT")
          here=$(cygpath -m "$PWD" 2>/dev/null || pwd)
          if [ "$RUNNER_OS" = Linux ]; then
            triplets="x64-linux x64-linux-dynamic"
          else
            triplets="x64-windows x64-windows-static"
          fi
          for triplet in $triplets; do
            cmake -S bindings/cpp/vcpkg/test -B "build/vcpkg-$triplet" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$root/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_OVERLAY_PORTS="$here/bindings/cpp/vcpkg/ports" \
              -DVCPKG_TARGET_TRIPLET=$triplet
            cmake --build "build/vcpkg-$triplet" --config Release
            ctest --test-dir "build/vcpkg-$triplet" -C Release --output-on-failure
          done

  miri:
    name: Miri (C ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Every `unsafe` block of the boundary, under the interpreter.
      - run: cargo miri test -p cleanrules-ffi --lib --test abi --test values --test run

  msrv:
    name: Rust 1.95 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --features cleanrules/yaml

  rust-docs:
    name: Rust docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --features cleanrules/yaml

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  lint:
    name: Lint the Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check --output-format=github .
      - run: uvx ruff format --check .

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14t", "3.15", "3.15t"]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # uv builds the extension with maturin for this interpreter, then tests it.
      - run: uv run --python ${{ matrix.python }} pytest
      - if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        run: uv run --python 3.11 pyright
      # Every public name of the package has a complete type.
      - if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        run: uv run --python 3.11 pyright --verifytypes cleanrules --ignoreexternal

  conformance:
    name: Spec schemas and conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with jsonschema python spec/schemas/check.py
      - run: uv run --no-project --with jsonschema python conformance/tools/check.py
