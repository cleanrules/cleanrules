[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rulepy"
dynamic = ["version"]
description = "A rules engine for business rules, expert systems, data validation and ML explanations, with crisp and fuzzy logic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jose L. Salmeron" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "rules engine",
    "business rules",
    "expert system",
    "rete",
    "data validation",
    "explainable ai",
    "fuzzy logic",
    "decision tables",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Extras are declared up front so the public install surface is stable; each
# phase of docs/PLAN.md fills in its own. The core itself has no dependencies.
[project.optional-dependencies]
fuzzy = []       # fuzzytool (phase 5)
polars = []      # polars backend for validation (phase 4)
pandas = []      # pandas support (phase 4)
yaml = []        # YAML rule files (phase 3)
audit = []       # z3 solver for static audit (phase 5)
ml = []          # scikit-learn, imodels (phase 8)
fast = []        # rulepy-core Rust accelerator (phase 7)
bench = []       # competitor libraries for benchmarks (phase 2+)
docs = []        # mkdocs-material, mkdocstrings (phase 1.7)

[tool.hatch.version]
path = "src/rulepy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rulepy"]

# Development tooling (Claude Code config, roadmap) stays out of the sdist.
[tool.hatch.build.targets.sdist]
exclude = [".claude/", "CLAUDE.md", "docs/PLAN.md"]
