[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Jose L. Salmeron"]
repository = "https://github.com/cleanrules/cleanrules"
homepage = "https://cleanrules.github.io"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Library code never panics on bad input; tests may (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Logging goes through `tracing`, never straight to the terminal.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
