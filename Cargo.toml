[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "bindings/python", "bindings/js"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Jose L. Salmeron"]
repository = "https://github.com/cleanrules/cleanrules"
homepage = "https://cleanrules.github.io"

# The core, by path inside the workspace and by version once published.
[workspace.dependencies]
cleanrules = { path = "crates/core", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Library code never panics on bad input; tests may (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Logging goes through `tracing`, never straight to the terminal.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

# Xcode 27's strip can corrupt Mach-O libraries ("mis-aligned LINKEDIT string
# pool"; seen on a Python extension and on a proc macro, macOS 27), and release
# strips debuginfo by default. Not stripping costs about 8 % in size.
[profile.release]
strip = false

[profile.release.build-override]
strip = false
