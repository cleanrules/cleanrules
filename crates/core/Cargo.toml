[package]
name = "cleanrules"
description = "Explainable rules engine: one Rust core with the same semantics in Rust, C/C++, Python, JavaScript, Java/Scala, Go and Erlang"
readme = "README.md"
keywords = ["rules-engine", "business-rules", "expert-system", "validation", "explainable"]
categories = ["algorithms", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Powers and logarithms of the fuzzy logics, in pure Rust (musl's
# algorithms), so every platform and WebAssembly compute the same bits
# (`spec/ast.md`, *Logics*); without the `arch` feature, no
# architecture-specific code paths.
libm = { version = "0.2.16", default-features = false }
regex = "1.13.1"
saphyr-parser = { version = "0.3.3", optional = true }
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = "1.49.0"
proptest = "1.12.0"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "explain"
harness = false

[features]
# YAML rule files (`spec/json-format.md`, *YAML*).
yaml = ["dep:saphyr-parser"]

# The example of the fuzzy logics in the documentation (task J.1).
[[example]]
name = "fuzzy"
path = "../../docs/examples/fuzzy.rs"
