[package]
name = "cleanrules"
description = "Explainable rules engine: one Rust core with the same semantics in Rust, C/C++, Python, JavaScript, Java/Scala, Go and Erlang"
readme = "README.md"
keywords = ["rules-engine", "business-rules", "expert-system", "validation", "explainable"]
categories = ["algorithms", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Powers and logarithms of the fuzzy logics, in pure Rust (musl's
# algorithms), so every platform and WebAssembly compute the same bits
# (`spec/ast.md`, *Logics*); without the `arch` feature, no
# architecture-specific code paths.
libm = { version = "0.2.16", default-features = false }
regex = "1.13.1"
saphyr-parser = { version = "0.3.3", optional = true }
# SHA-256 of the canonical bytes of documents (`spec/json-format.md`,
# *Digests*): RustCrypto's pure-Rust implementation, without default
# features (no `alloc`, no OIDs).
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = "1.49.0"
proptest = "1.12.0"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "explain"
harness = false

[features]
# YAML rule files (`spec/json-format.md`, *YAML*).
yaml = ["dep:saphyr-parser"]

# The example of the fuzzy logics in the documentation (task J.1).
[[example]]
name = "fuzzy"
path = "../../docs/examples/fuzzy.rs"

# The example of decimal arithmetic in the documentation (task R.4).
[[example]]
name = "decimals"
path = "../../docs/examples/decimals.rs"

# The example of rule identity in the documentation (task R.3).
[[example]]
name = "rule_ids"
path = "../../docs/examples/rule_ids.rs"

# The example of canonical bytes and digests in the documentation (task R.2).
[[example]]
name = "digests"
path = "../../docs/examples/digests.rs"

# The example of reproducible bundles in the documentation (task R.5).
[[example]]
name = "bundles"
path = "../../docs/examples/bundles.rs"

# The example of test cases in the documentation (task T.1).
[[example]]
name = "cases"
path = "../../docs/examples/cases.rs"
required-features = ["yaml"]

# The example of the static audit in the documentation (task T.7).
[[example]]
name = "audit"
path = "../../docs/examples/audit.rs"

# The example of running test cases in the documentation (tasks T.2 and T.3).
[[example]]
name = "test_run"
path = "../../docs/examples/test_run.rs"

# The example of a run's statistics and coverage in the documentation (task T.10).
[[example]]
name = "statistics"
path = "../../docs/examples/statistics.rs"
