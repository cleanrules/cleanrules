[package]
name = "cleanrules-ffi"
description = "C ABI of cleanrules: opaque handles, explicit ownership, documents and decisions as JSON"
readme = "README.md"
keywords = ["rules-engine", "ffi", "c", "explainable"]
categories = ["algorithms", "external-ffi-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "cleanrules_ffi"
# A shared and a static library for C, and an rlib for the Rust tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
cleanrules = { workspace = true, features = ["yaml"] }

# The workspace's lints, except that this crate may use `unsafe`: every block
# says why it is sound, and every unsafe function says what its caller promises
# (CLAUDE.md, invariant 10).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
