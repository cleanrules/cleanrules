[package]
name = "cleanrules-cli"
description = "The cleanrules command line: audit, validate and draw rule sets and decision tables, with exit codes for CI"
readme = "README.md"
keywords = ["rules-engine", "cli", "audit", "decision-table", "explainable"]
categories = ["command-line-utilities", "algorithms"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The command is named after the engine. Its documentation is spec/cli.md and
# `cleanrules --help`: rustdoc would write it over the core crate's.
[[bin]]
name = "cleanrules"
path = "src/main.rs"
doc = false

[dependencies]
cleanrules = { workspace = true }
# Arguments, help and usage errors (approved for this crate only, 2026-11-23).
# Without colour and suggestions, which would add crates.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[dev-dependencies]
insta = "1.49.0"

[features]
default = ["yaml"]
# YAML rule files (`spec/json-format.md`, *YAML*).
yaml = ["cleanrules/yaml"]

[lints]
workspace = true
