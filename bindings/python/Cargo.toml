[package]
name = "cleanrules-python"
description = "Python binding of cleanrules (PyO3), built by maturin into the `cleanrules` package"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "_cleanrules"
crate-type = ["cdylib"]
# An extension module does not link libpython, so test binaries cannot link:
# the binding is tested from Python.
test = false
doctest = false

[lints]
workspace = true

[dependencies]
cleanrules = { path = "../../crates/core", features = ["yaml"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311", "abi3t-py315"] }
