[package]
name = "cleanrules-node"
description = "Node.js binding of cleanrules (napi-rs), built by @napi-rs/cli into the `cleanrules` npm package"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib"]
# A Node addon resolves N-API at load time, so test binaries cannot run it:
# the binding is tested from JavaScript (`npm test`).
test = false
doctest = false

# The workspace's lints, except that `unsafe_code` is `deny` instead of
# `forbid`: the `#[napi]` macros generate `unsafe` blocks under
# `#[allow(unsafe_code)]`, which `forbid` would reject. Code written here has
# no `unsafe` (CLAUDE.md, invariant 10): `deny` still rejects it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

[dependencies]
cleanrules = { workspace = true, features = ["yaml"] }
napi = { version = "3.16.1", default-features = false, features = ["napi9", "dyn-symbols"] }
napi-derive = "3.7.0"

[build-dependencies]
napi-build = "2.6.0"
